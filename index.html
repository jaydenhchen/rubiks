<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rubik’s Cube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="hud">
    <header class="topbar">
      <div class="brand">
        <h1>RUBIK</h1>
        <span>3×3 · keys · autosolve</span>
      </div>
      <div class="speed">
        <span>Speed</span>
        <input id="speed" type="range" min="0.6" max="4" step="0.1" value="1.2" />
        <b id="speed-label">1.2×</b>
      </div>
      <div class="actions">
        <button id="btn-scramble">Scramble</button>
        <button id="btn-solve" class="primary">Solve</button>
        <button id="btn-reset">Reset</button>
      </div>
    </header>
    <footer class="bottom">
      <div class="status-row">
        <div>Status <b id="status">Ready</b></div>
        <div id="count">0 moves</div>
      </div>
      <div class="tape" id="tape"></div>
      <div class="keys">
        <span class="kbd"><kbd>U</kbd><kbd>R</kbd><kbd>F</kbd><kbd>D</kbd><kbd>L</kbd><kbd>B</kbd> faces</span>
        <span class="kbd"><kbd>Shift</kbd> prime</span>
        <span class="kbd"><kbd>2</kbd> then face for 180°</span>
        <span class="kbd"><kbd>X</kbd><kbd>Y</kbd><kbd>Z</kbd> cube</span>
        <span class="kbd"><kbd>Space</kbd> scramble</span>
        <span class="kbd"><kbd>Enter</kbd> solve</span>
        <span class="kbd"><kbd>Esc</kbd> reset</span>
        <span class="kbd"><kbd>⌫</kbd> undo</span>
        <span class="kbd">drag to orbit</span>
      </div>
    </footer>
  </div>
  <script type="module" src="./js/app.js?v=17"></script>
</body>
</html>
